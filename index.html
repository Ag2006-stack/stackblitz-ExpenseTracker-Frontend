<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        
        <div class="input-group">
            <input type="text" id="type" placeholder="Type (e.g. ElectricBill)">
            <input type="number" id="price" placeholder="Price (e.g. 100)">
            <input type="text" id="status" placeholder="Status (e.g. unpaid)">
            <button onclick="addExpense()">Add Expense</button>
        </div>

        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Search by type...">
            <button onclick="searchExpenses()" class="search-btn">Search</button>
            <button onclick="loadData()" class="clear-btn">Reset</button>
        </div>

        <div id="display-list">
            <h3>Loading...</h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>s
