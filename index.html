<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <div class="input-group">
            <input type="text" id="type" placeholder="Expense Type">
            <input type="number" id="price" placeholder="Price">
            <input type="text" id="status" placeholder="Status">
            <button onclick="addExpense()">Add Expense</button>
        </div>

        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Search expense type">
            <button class="search-btn" onclick="searchExpenses()">Search</button>
            <button class="clear-btn" onclick="loadData()">Reset</button>
        </div>

        <div id="display-list">
            <h3>Loading...</h3>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
